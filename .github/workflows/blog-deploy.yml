name: Blog CD

on:
  workflow_run:
    workflows:
      - Blog CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  deploy-release:
    name: 部署博客
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://gentleyun.cn

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: 下载 CI 发布包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blog-release-${{ github.event.workflow_run.head_sha }}
          path: artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验部署参数和发布包
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_USER" == "deploy-blog" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]]
          [[ -n "$DEPLOY_SSH_KEY" ]]
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]

          archive="artifact/gentleyun-blog-${RELEASE_ID}.tar.gz"
          [[ -f "$archive" ]]
          [[ -f artifact/sha256sums.txt ]]
          (
            cd artifact
            sha256sum --check --strict sha256sums.txt
          )

          mapfile -t metadata_lines < <(tar -xOf "$archive" ./metadata.txt)
          [[ ${#metadata_lines[@]} -eq 3 ]]
          [[ ${metadata_lines[0]} == "COMMIT_SHA=${RELEASE_ID}" ]]
          [[ ${metadata_lines[1]} == "SOURCE_RUN_ID=${SOURCE_RUN_ID}" ]]
          [[ ${metadata_lines[2]} =~ ^BACKEND_CHANGED=[01]$ ]]
          echo "backend_changed=${metadata_lines[2]#BACKEND_CHANGED=}" >>"$GITHUB_OUTPUT"

      - name: 配置 SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      - name: 上传发布包
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_dir="/var/lib/github-deploy/blog/incoming/${RELEASE_ID}"
          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
          )

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077 && mkdir -p '$remote_dir' && rm -f '$remote_dir/sha256sums.txt' '$remote_dir/gentleyun-blog-${RELEASE_ID}.tar.gz'"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "artifact/gentleyun-blog-${RELEASE_ID}.tar.gz" \
            artifact/sha256sums.txt \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_dir}/"

      - name: 部署 PocketBase Hooks 和 Migrations
        if: steps.package.outputs.backend_changed == '1'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/deploy-gentleyun-blog-backend --release-id '$RELEASE_ID'"

      - name: 部署博客前端
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/deploy-gentleyun-blog --release-id '$RELEASE_ID' --component frontend"

      - name: 从 Runner 验证公网地址
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 20 https://gentleyun.cn/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://gentleyun.cn/admin/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://gentleyun.cn/api/health >/dev/null
