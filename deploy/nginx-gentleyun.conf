map $request_method $blog_write_limit_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=blog_admin_login:10m rate=5r/m;
limit_req_zone $blog_write_limit_key zone=blog_write:10m rate=30r/m;

server {
    listen 80;
    server_name gentleyun.cn www.gentleyun.cn;
    return 301 https://gentleyun.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name gentleyun.cn www.gentleyun.cn;

    root /var/www/gentleyun/html;
    index index.html;
    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/gentleyun.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gentleyun.cn/privkey.pem;

    # 单独限制超级管理员登录，降低公网暴力尝试风险。
    location = /api/collections/_superusers/auth-with-password {
        limit_req zone=blog_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET 不计入写请求限流；评论、留言、阅读上报和管理写入统一限速。
    location /api/ {
        limit_req zone=blog_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PocketBase 原生后台不对公网开放，管理员使用中文管理端。
    location ^~ /_/ {
        return 404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
