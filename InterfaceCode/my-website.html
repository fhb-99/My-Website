<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome · My Blog</title>
    <style>
      :root {
        --bg: #f7fbff;
        --paper: rgba(255, 255, 255, 0.82);
        --paper-strong: #ffffff;
        --ink: #172033;
        --muted: #6b7890;
        --line: rgba(44, 92, 150, 0.12);
        --blue: #3a86ff;
        --cyan: #4cc9f0;
        --green: #8bd7bd;
        --peach: #ffd6b7;
        --shadow: 0 24px 70px rgba(38, 77, 120, 0.13);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 18%, rgba(76, 201, 240, 0.22), transparent 28%),
          radial-gradient(circle at 86% 12%, rgba(255, 214, 183, 0.42), transparent 26%),
          radial-gradient(circle at 78% 86%, rgba(139, 215, 189, 0.28), transparent 30%),
          linear-gradient(135deg, #fbfdff 0%, #edf7ff 48%, #fff8f0 100%);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(58, 134, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(58, 134, 255, 0.045) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at 50% 40%, black, transparent 78%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid rgba(255, 255, 255, 0.62);
        background: rgba(247, 251, 255, 0.72);
        backdrop-filter: blur(18px);
      }

      .nav-inner {
        width: min(1120px, calc(100% - 36px));
        margin: 0 auto;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #ffffff;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        box-shadow: 0 12px 28px rgba(58, 134, 255, 0.24);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .nav-link {
        padding: 9px 12px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        transition: color 0.18s ease, background 0.18s ease;
      }

      .nav-link:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.72);
      }

      .hero {
        width: min(1120px, calc(100% - 36px));
        margin: 0 auto;
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.95fr);
        align-items: center;
        gap: clamp(32px, 6vw, 76px);
        padding: clamp(58px, 9vw, 108px) 0 54px;
      }

      .hero-copy {
        animation: riseIn 0.72s ease both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: #356293;
        font-size: 13px;
        font-weight: 750;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 0 5px rgba(139, 215, 189, 0.18);
      }

      h1 {
        margin-top: 22px;
        max-width: 720px;
        font-size: clamp(42px, 7vw, 86px);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      .gradient-text {
        background: linear-gradient(110deg, #18243a 0%, #276fd8 48%, #21a7c8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        margin-top: 24px;
        max-width: 610px;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 19px);
        line-height: 1.85;
      }

      .actions {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .primary-btn,
      .ghost-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        font-weight: 800;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      .primary-btn {
        color: #ffffff;
        background: linear-gradient(135deg, var(--blue), #2fb6d2);
        box-shadow: 0 18px 40px rgba(58, 134, 255, 0.26);
      }

      .primary-btn:hover,
      .ghost-btn:hover {
        transform: translateY(-2px);
      }

      .ghost-btn {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        color: #33516f;
      }

      .visual {
        position: relative;
        min-height: 460px;
        animation: riseIn 0.82s ease 0.08s both;
      }

      .desk-card {
        position: absolute;
        inset: 54px 20px 32px 42px;
        padding: 26px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 34px;
        background: var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .window-dots {
        display: flex;
        gap: 8px;
      }

      .window-dots span {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d7e4f2;
      }

      .window-dots span:nth-child(1) { background: #ffb4a8; }
      .window-dots span:nth-child(2) { background: #ffd98e; }
      .window-dots span:nth-child(3) { background: #9ee6c8; }

      .note-title {
        margin-top: 24px;
        font-size: 25px;
        font-weight: 850;
        letter-spacing: -0.03em;
      }

      .note-line {
        margin-top: 14px;
        height: 12px;
        border-radius: 999px;
        background: #e8f0f8;
      }

      .note-line.short { width: 62%; }
      .note-line.mid { width: 78%; }
      .note-line.long { width: 90%; }

      .mini-grid {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .mini-card {
        min-height: 86px;
        padding: 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(44, 92, 150, 0.08);
      }

      .mini-card strong {
        display: block;
        color: #213553;
        font-size: 15px;
      }

      .mini-card span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .float-card {
        position: absolute;
        z-index: 2;
        border-radius: 24px;
        background: var(--paper-strong);
        border: 1px solid rgba(255, 255, 255, 0.86);
        box-shadow: 0 18px 48px rgba(45, 80, 120, 0.12);
        animation: floatY 4.8s ease-in-out infinite;
      }

      .float-card.reading {
        left: 0;
        top: 18px;
        width: 180px;
        padding: 18px;
      }

      .float-card.idea {
        right: 0;
        bottom: 8px;
        width: 190px;
        padding: 18px;
        animation-delay: -1.6s;
      }

      .float-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .float-value {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .soft-orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(1px);
        opacity: 0.72;
      }

      .orb-a {
        width: 170px;
        height: 170px;
        right: 48px;
        top: 0;
        background: radial-gradient(circle, rgba(76, 201, 240, 0.42), transparent 68%);
      }

      .orb-b {
        width: 220px;
        height: 220px;
        left: 34px;
        bottom: 0;
        background: radial-gradient(circle, rgba(255, 214, 183, 0.58), transparent 68%);
      }

      .footer {
        position: relative;
        z-index: 2;
        width: min(1120px, calc(100% - 36px));
        margin: 0 auto;
        padding: 22px 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid rgba(44, 92, 150, 0.08);
      }

      .beian-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .beian-link {
        color: inherit;
      }

      .beian-link:hover {
        color: var(--ink);
      }

      .beian-gongan {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .beian-gongan img {
        display: block;
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes floatY {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      @media (max-width: 860px) {
        .hero {
          grid-template-columns: 1fr;
          padding-top: 42px;
        }

        .visual {
          min-height: 420px;
          order: -1;
        }

        .desk-card {
          inset: 44px 0 34px 24px;
        }
      }

      @media (max-width: 640px) {
        .nav-inner {
          min-height: auto;
          padding: 14px 0;
          align-items: flex-start;
          flex-direction: column;
        }

        .nav-links {
          gap: 4px;
        }

        .nav-link {
          padding: 7px 9px;
          font-size: 13px;
        }

        .hero {
          width: min(100% - 28px, 1120px);
        }

        .visual {
          min-height: 360px;
        }

        .desk-card {
          inset: 34px 0 26px 0;
          padding: 20px;
          border-radius: 28px;
        }

        .float-card.reading {
          left: 8px;
          top: 0;
          width: 150px;
        }

        .float-card.idea {
          right: 8px;
          width: 158px;
        }

        .mini-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="nav" aria-label="主导航">
        <div class="nav-inner">
          <a class="brand" href="my-website.html" aria-label="返回开屏页">
            <span class="brand-mark">B</span>
            <span>My Blog</span>
          </a>
          <div class="nav-links">
            <a class="nav-link" href="home.html">首页</a>
            <a class="nav-link" href="posts.html">文章</a>
            <a class="nav-link" href="projects.html">项目</a>
            <a class="nav-link" href="about.html">关于</a>
          </div>
        </div>
      </nav>

      <main class="hero">
        <section class="hero-copy" aria-labelledby="welcomeTitle">
          <div class="eyebrow">Welcome to my corner</div>
          <h1 id="welcomeTitle">记录技术，也记录<span class="gradient-text">生活的光</span></h1>
          <p class="subtitle">
            这里是我的个人博客，放一些 C++ 后端、前端界面、项目复盘和日常想法。希望它像一张干净的书桌，打开时轻松，读起来舒服。
          </p>
          <div class="actions">
            <a class="primary-btn" href="home.html">进入博客主页</a>
            <a class="ghost-btn" href="posts.html">先看文章</a>
          </div>
        </section>

        <section class="visual" aria-hidden="true">
          <div class="soft-orb orb-a"></div>
          <div class="soft-orb orb-b"></div>

          <div class="float-card reading">
            <div class="float-label">Now writing</div>
            <div class="float-value">Blog</div>
          </div>

          <div class="desk-card">
            <div class="window-dots"><span></span><span></span><span></span></div>
            <div class="note-title">Today's notes</div>
            <div class="note-line long"></div>
            <div class="note-line mid"></div>
            <div class="note-line short"></div>

            <div class="mini-grid">
              <div class="mini-card">
                <strong>Backend</strong>
                <span>接口、数据、部署和安全边界。</span>
              </div>
              <div class="mini-card">
                <strong>Frontend</strong>
                <span>页面、交互和一点审美实验。</span>
              </div>
            </div>
          </div>

          <div class="float-card idea">
            <div class="float-label">Mood</div>
            <div class="float-value">Clean</div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>© <span id="year"></span> My Blog. Built with curiosity.</p>
        <div class="beian-row">
          <a class="beian-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">赣ICP备2026009462号-1</a>
          <a class="beian-link beian-gongan" href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=36010602000401" target="_blank" rel="noopener noreferrer">
            <img src="https://www.beian.gov.cn/img/ghs.png" width="16" height="16" alt="" />
            赣公网安备36010602000401号
          </a>
        </div>
      </footer>
    </div>

    <script>
      var year = document.getElementById("year");
      if (year) year.textContent = new Date().getFullYear();
    </script>
  </body>
</html>
