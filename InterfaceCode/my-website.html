<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开屏 · My Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --theme-key: blog-theme;
      }

      html[data-theme="night"] {
        --page-bg: url("images/hero-night.png");
        --page-scrim: linear-gradient(
          180deg,
          rgba(8, 14, 40, 0.72) 0%,
          rgba(12, 22, 48, 0.55) 35%,
          rgba(6, 12, 32, 0.68) 100%
        );
        --nav-bg: rgba(18, 22, 46, 0.52);
        --nav-border: rgba(255, 255, 255, 0.08);
        --text: #f4f8ff;
        --text-dim: rgba(244, 248, 255, 0.82);
        --bubble-bg: rgba(255, 255, 255, 0.94);
        --bubble-text: #333;
        --fab-bg: rgba(255, 255, 255, 0.92);
        --fab-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        --accent-line: rgba(120, 190, 255, 0.65);
      }

      html[data-theme="day"] {
        --page-bg: url("images/hero-day.png");
        --page-scrim: linear-gradient(
          180deg,
          rgba(255, 245, 252, 0.55) 0%,
          rgba(230, 220, 255, 0.42) 45%,
          rgba(200, 210, 255, 0.5) 100%
        );
        --nav-bg: rgba(210, 200, 255, 0.45);
        --nav-border: rgba(255, 255, 255, 0.35);
        --text: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.92);
        --bubble-bg: rgba(255, 255, 255, 0.96);
        --bubble-text: #2b2b40;
        --fab-bg: rgba(255, 255, 255, 0.95);
        --fab-shadow: 0 10px 26px rgba(80, 60, 140, 0.28);
        --accent-line: rgba(130, 110, 255, 0.55);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        color: var(--text);
        background-color: #0a1028;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -24px;
        pointer-events: none;
        z-index: 0;
        background-image: var(--page-bg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transform: scale(1.06);
        filter: blur(3px) saturate(1.1) contrast(0.84) brightness(0.85);
      }

      html[data-theme="day"] body::before {
        filter: blur(2.6px) saturate(0.98) contrast(0.88) brightness(1.04);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: var(--page-scrim),
          radial-gradient(1200px 700px at 50% 35%, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.46) 75%),
          rgba(0, 0, 0, 0.12);
      }

      html[data-theme="day"] body::after {
        background: var(--page-scrim),
          radial-gradient(1200px 700px at 50% 35%, rgba(255, 255, 255, 0.1), rgba(90, 70, 150, 0.22) 75%),
          rgba(255, 255, 255, 0.08);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .nav-blur {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        background: var(--nav-bg);
        border-bottom: 1px solid var(--nav-border);
      }

      .nav-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .nav-cluster {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 14px;
      }

      .music-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.12);
        color: var(--text-dim);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      html[data-theme="day"] .music-pill {
        background: rgba(255, 255, 255, 0.35);
        border-color: rgba(255, 255, 255, 0.45);
        color: #3a2f55;
      }

      .music-pill .chev {
        opacity: 0.65;
        font-size: 11px;
      }

      .music-pill:focus-visible,
      .icon-btn:focus-visible,
      .fab:focus-visible,
      .nav-link:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.55);
        outline-offset: 2px;
      }

      .music-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 90;
        display: none;
      }

      .music-drawer {
        position: fixed;
        top: 56px;
        left: 18px;
        width: min(420px, calc(100vw - 36px));
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(22, 28, 58, 0.58);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        z-index: 95;
        display: none;
        overflow: hidden;
      }

      html[data-theme="day"] .music-drawer {
        background: rgba(255, 255, 255, 0.5);
        border-color: rgba(255, 255, 255, 0.45);
      }

      .music-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text-dim);
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 12px;
      }

      .music-body {
        padding: 12px 14px 14px;
      }

      .music-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .music-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      html[data-theme="day"] .music-title {
        color: #2b2b40;
      }

      .music-sub {
        margin-top: 4px;
        font-size: 13px;
        color: rgba(214, 226, 250, 0.72);
      }

      html[data-theme="day"] .music-sub {
        color: rgba(60, 45, 100, 0.7);
      }

      .music-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pill-btn {
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-dim);
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
      }

      html[data-theme="day"] .pill-btn {
        background: rgba(255, 255, 255, 0.38);
        border-color: rgba(255, 255, 255, 0.48);
        color: #3a2f55;
      }

      body.music-open .music-overlay,
      body.music-open .music-drawer {
        display: block;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        font-weight: 500;
        padding: 6px 4px;
        color: var(--text-dim);
        transition: opacity 0.15s ease;
      }

      .nav-link:hover {
        opacity: 1;
        color: var(--text);
      }

      .nav-link svg {
        width: 15px;
        height: 15px;
        opacity: 0.95;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text);
      }

      html[data-theme="day"] .icon-btn {
        background: rgba(255, 255, 255, 0.45);
        border-color: rgba(255, 255, 255, 0.55);
        color: #4a3d68;
      }

      .hero {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 96px 20px 120px;
        position: relative;
        z-index: 2;
      }

      .hero-title {
        font-family: "Noto Serif SC", "Times New Roman", serif;
        font-weight: 700;
        font-size: clamp(36px, 7vw, 64px);
        letter-spacing: 0.04em;
        text-shadow: 0 4px 28px rgba(0, 0, 0, 0.45);
      }

      html[data-theme="day"] .hero-title {
        text-shadow: 0 2px 24px rgba(90, 60, 140, 0.35), 0 4px 40px rgba(0, 0, 0, 0.25);
      }

      .hero-sub {
        margin-top: 14px;
        font-size: clamp(14px, 2.4vw, 18px);
        font-weight: 400;
        color: var(--text-dim);
        max-width: 520px;
        line-height: 1.65;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      }

      html[data-theme="day"] .hero-sub {
        color: #ede8ff;
        text-shadow: 0 2px 14px rgba(60, 40, 100, 0.45);
      }

      .hero-cta {
        margin-top: 28px;
      }

      .btn-enter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 32px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.12);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .btn-enter:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.2);
      }

      .live2d-corner {
        position: fixed;
        left: 18px;
        bottom: 56px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        max-width: min(320px, calc(100vw - 36px));
        pointer-events: none;
      }

      .speech {
        background: var(--bubble-bg);
        color: var(--bubble-text);
        padding: 12px 14px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.55;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        position: relative;
      }

      .speech::after {
        content: "";
        position: absolute;
        left: 28px;
        bottom: -8px;
        border-width: 8px 8px 0 8px;
        border-style: solid;
        border-color: var(--bubble-bg) transparent transparent transparent;
      }

      .chibi {
        width: 96px;
        height: 96px;
        border-radius: 18px;
        background: linear-gradient(145deg, #faf5ff, #dbe4ff);
        border: 2px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
        display: grid;
        place-items: center;
        font-size: 42px;
        pointer-events: auto;
      }

      .site-footer {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 0 20px 32px;
        margin-top: -48px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .site-footer .beian-row {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px 18px;
      }

      .site-footer .beian-link {
        color: inherit;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .site-footer .beian-link:hover {
        text-decoration: underline;
      }

      .site-footer .beian-gongan img {
        display: block;
      }

      .fab-stack {
        position: fixed;
        right: 18px;
        bottom: 22px;
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fab {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: none;
        background: var(--fab-bg);
        box-shadow: var(--fab-shadow);
        cursor: pointer;
        display: grid;
        place-items: center;
        color: #5b4a86;
        transition: transform 0.12s ease;
      }

      .fab:hover {
        transform: translateY(-2px);
      }

      .fab svg {
        width: 22px;
        height: 22px;
      }

      .progress-strip {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        z-index: 70;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .progress-strip span {
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
        animation: glide 2.4s ease-in-out infinite;
      }

      @keyframes glide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      @media (max-width: 640px) {
        .music-pill span:not(.chev) {
          max-width: 140px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .live2d-corner {
          bottom: 100px;
        }
      }
    </style>
  </head>

    <div class="fab-stack">
      <button type="button" class="fab" id="themeToggle" aria-label="切换日间/夜间主题">
        <!-- icon injected by script -->
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M21 14.5A7.5 7.5 0 0 1 9.5 6c0-1.05.21-2.05.59-2.96A7.5 7.5 0 1 0 21 13.91c-.29.09-.59.13-.9.13-.2 0-.39-.02-.59-.04z"

    <script>
      (function () {
        const KEY = "blog-theme";
        const root = document.documentElement;

        function iconMoon() {
          return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.5A7.5 7.5 0 0 1 9.5 6c0-1.05.21-2.05.59-2.96A7.5 7.5 0 1 0 21 13.91c-.29.09-.59.13-.9.13-.2 0-.39-.02-.59-.04z"/></svg>';
        }
        function iconSun() {
          return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.8 1.42-1.42zm10.48 0l1.79-1.79 1.41 1.41-1.79 1.8-1.41-1.42zM12 4V1h-2v3h2zm0 19v-3h-2v3h2zm8-9h3v-2h-3v2zM1 12h3v-2H1v2zm14.24 7.16l1.79 1.79 1.41-1.41-1.79-1.8-1.41 1.42zM6.76 19.16l-1.8 1.79-1.41-1.41 1.79-1.8 1.42 1.42zM12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg>';
        }

        function applyTheme(t) {
          root.dataset.theme = t;
          localStorage.setItem(KEY, t);
          const btn = document.getElementById("themeToggle");
          if (!btn) return;
          btn.innerHTML = t === "night" ? iconSun() : iconMoon();
          btn.setAttribute("aria-label", t === "night" ? "切换到日间模式" : "切换到夜间模式");
        }

        const saved = localStorage.getItem(KEY);
        applyTheme(saved === "day" || saved === "night" ? saved : "night");

        document.getElementById("themeToggle").addEventListener("click", function () {
          applyTheme(root.dataset.theme === "night" ? "day" : "night");
        });

        function greetingText() {
          const h = new Date().getHours();
          if (h >= 22 || h < 5) return "你是夜猫子呀？这么晚还不睡觉，明天起得来嘛～";
          if (h < 11) return "早上好呀，新的一天也要元气满满哦～";
          if (h < 14) return "中午啦，记得按时吃饭休息一会儿～";
          if (h < 18) return "下午好，喝杯水再继续冲冲冲～";
          return "傍晚啦，天色很美，适合整理今天的收获～";
        }

        var el = document.getElementById("greetingBubble");
        if (el) el.textContent = greetingText();

        function setMusicOpen(open) {
          document.body.classList.toggle("music-open", open);
          var t = document.getElementById("musicToggle");
          if (t) t.setAttribute("aria-expanded", open ? "true" : "false");
          var ov = document.getElementById("musicOverlay");
          if (ov) ov.setAttribute("aria-hidden", open ? "false" : "true");
        }

        var mt = document.getElementById("musicToggle");
        var mc = document.getElementById("musicClose");
        var mo = document.getElementById("musicOverlay");

        if (mt) {
          mt.addEventListener("click", function () {
            setMusicOpen(!document.body.classList.contains("music-open"));
          });
        }
        if (mc) mc.addEventListener("click", function () { setMusicOpen(false); });
        if (mo) mo.addEventListener("click", function () { setMusicOpen(false); });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setMusicOpen(false);
        });

        var y = document.getElementById("y");
        if (y) y.textContent = new Date().getFullYear();
      })();
    </script>
  </body>
</html>
