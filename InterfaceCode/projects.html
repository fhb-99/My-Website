<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目 · My Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html[data-theme="night"] {
        --body-bg: #0d1220;
        --page-surface: radial-gradient(circle at 18% 12%, rgba(64, 102, 196, 0.2), transparent 28%),
          radial-gradient(circle at 82% 18%, rgba(66, 184, 205, 0.14), transparent 26%),
          linear-gradient(180deg, #0d1220 0%, #111827 52%, #0b1020 100%);
        --nav-bg: rgba(22, 26, 52, 0.55);
        --nav-border: rgba(255, 255, 255, 0.09);
        --text: #f4f8ff;
        --text-dim: rgba(244, 248, 255, 0.82);
        --text-muted: rgba(214, 226, 250, 0.72);
        --glass: rgba(28, 34, 72, 0.42);
        --glass-strong: rgba(22, 28, 58, 0.58);
        --card-border: rgba(255, 255, 255, 0.14);
        --accent: #9ecbff;
        --fab-bg: rgba(255, 255, 255, 0.92);
        --fab-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      html[data-theme="day"] {
        --body-bg: #ffffff;
        --page-surface: #ffffff;
        --nav-bg: rgba(255, 255, 255, 0.78);
        --nav-border: rgba(26, 58, 96, 0.1);
        --text: #172033;
        --text-dim: rgba(23, 32, 51, 0.78);
        --text-muted: rgba(81, 96, 120, 0.72);
        --glass: rgba(255, 255, 255, 0.76);
        --glass-strong: rgba(255, 255, 255, 0.9);
        --card-border: rgba(26, 58, 96, 0.12);
        --accent: #2f7cf6;
        --fab-bg: rgba(255, 255, 255, 0.95);
        --fab-shadow: 0 10px 26px rgba(38, 77, 120, 0.18);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        color: var(--text);
        background: var(--body-bg);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: var(--page-surface);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background-image:
          linear-gradient(rgba(47, 124, 246, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(47, 124, 246, 0.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at 50% 32%, black, transparent 78%);
      }

      html[data-theme="day"] body::after {
        opacity: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .nav-blur {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        background: var(--nav-bg);
        border-bottom: 1px solid var(--nav-border);
      }

      .nav-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .nav-left,
      .nav-center {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 14px;
      }

      .nav-center {
        justify-content: center;
        flex: 1;
      }

      .music-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.12);
        color: var(--text-dim);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      html[data-theme="day"] .music-pill {
        background: rgba(255, 255, 255, 0.38);
        border-color: rgba(255, 255, 255, 0.48);
        color: #3a2f55;
      }

      .music-pill .chev {
        opacity: 0.65;
        font-size: 11px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        font-weight: 500;
        padding: 6px 4px;
        color: var(--text-dim);
      }

      .nav-link:hover {
        color: var(--text);
      }

      .nav-link svg {
        width: 15px;
        height: 15px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text);
      }

      html[data-theme="day"] .icon-btn {
        background: rgba(255, 255, 255, 0.45);
        border-color: rgba(255, 255, 255, 0.55);
        color: #4a3d68;
      }

      .music-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 90;
        display: none;
      }

      .music-drawer {
        position: fixed;
        top: 56px;
        left: 18px;
        width: min(420px, calc(100vw - 36px));
        border-radius: 16px;
        border: 1px solid var(--card-border);
        background: var(--glass-strong);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        z-index: 95;
        display: none;
        overflow: hidden;
      }

      .music-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text-dim);
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 12px;
      }

      .music-body {
        padding: 12px 14px 14px;
      }

      .music-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .music-sub {
        margin-top: 4px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .music-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pill-btn {
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-dim);
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
      }

      html[data-theme="day"] .pill-btn {
        background: rgba(255, 255, 255, 0.38);
        border-color: rgba(255, 255, 255, 0.48);
        color: #3a2f55;
      }

      .music-pill:focus-visible,
      .icon-btn:focus-visible,
      .fab:focus-visible,
      .nav-link:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.55);
        outline-offset: 2px;
      }

      body.music-open .music-overlay,
      body.music-open .music-drawer {
        display: block;
      }

      .hero-wrap {
        padding: 78px 18px 16px;
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .hero-title {
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
        font-size: clamp(28px, 4.8vw, 40px);
        letter-spacing: 0.03em;
        text-shadow: 0 4px 26px rgba(0, 0, 0, 0.45);
      }

      .hero-sub {
        margin-top: 10px;
        font-size: 14px;
        color: var(--text-dim);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
      }

      .shell {
        position: relative;
        z-index: 2;
        max-width: 1100px;
        margin: 10px auto 0;
        padding: 0 22px 56px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
        margin-top: 16px;
      }

      .card {
        padding: 18px;
        border-radius: 14px;
        border: 1px solid var(--card-border);
        background: var(--glass-strong);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .card h3 {
        font-size: 16px;
        margin-bottom: 8px;
      }

      .card p {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.55;
      }

      footer {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
      }

      footer .beian-row {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px 18px;
      }

      footer .beian-link {
        color: inherit;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      footer .beian-link:hover {
        text-decoration: underline;
      }

      footer .beian-gongan img {
        display: block;
      }

      .fab-stack {
        position: fixed;
        right: 18px;
        bottom: 22px;
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fab {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: none;
        background: var(--fab-bg);
        box-shadow: var(--fab-shadow);
        cursor: pointer;
        display: grid;
        place-items: center;
        color: #5b4a86;
        transition: transform 0.12s ease;
      }

      .fab:hover {
        transform: translateY(-2px);
      }

      .fab svg {
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <div class="nav-blur">
      <div class="nav-inner">
        <div class="nav-left">
          <button class="music-pill" id="musicToggle" type="button" aria-haspopup="dialog" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6zm-8 8v4a4 4 0 1 0 2 0v-4H4zm2 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 2a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"
              />
            </svg>
            <span>发现 《还是分开》</span>
            <span class="chev">&gt;</span>
          </button>
          <a class="nav-link" href="home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5z" />
            </svg>
            首页
          </a>
          <a class="nav-link" href="posts.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M4 4v15.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5V4z" />
            </svg>
            文章
          </a>
        </div>
        <div class="nav-center">
          <a class="nav-link" href="notes.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8z" />
            </svg>
            碎碎念
          </a>
          <a class="nav-link" href="about.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-1M12 8h.01" />
            </svg>
            关于
          </a>
          <a class="nav-link" href="guestbook.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H6l-4 3V11.5a8.5 8.5 0 0 1 17 0z" />
              <path d="M12 11.5a8.5 8.5 0 0 0-8.5 8.5" />
            </svg>
            留言板
          </a>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 10px">
          <a class="nav-link" href="my-website.html" style="font-size: 12px; opacity: 0.85">开屏</a>
          <button type="button" class="icon-btn" aria-label="搜索（示意）">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <header class="hero-wrap">
      <h1 class="hero-title">项目</h1>
      <p class="hero-sub">把你做过的小工具、练习项目、实验记录放在这里。</p>
    </header>

    <div class="music-overlay" id="musicOverlay" aria-hidden="true"></div>
    <section class="music-drawer" id="musicDrawer" role="dialog" aria-modal="true" aria-label="音乐">
      <div class="music-head">
        <span>正在播放</span>
        <button type="button" class="icon-btn" id="musicClose" aria-label="关闭音乐面板">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="music-body">
        <div>
          <div class="music-title">还是分开</div>
          <div class="music-sub">示例播放模块（后续可接真实播放器）</div>
        </div>
        <div class="music-actions">
          <button class="pill-btn" type="button">上一首</button>
          <button class="pill-btn" type="button">播放 / 暂停</button>
          <button class="pill-btn" type="button">下一首</button>
        </div>
      </div>
    </section>

    <div class="shell">
      <div class="grid">
        <article class="card">
          <h3>静态博客 UI</h3>
          <p>开屏 + 首页 + 模块页，玻璃拟态风格，昼夜主题切换。</p>
        </article>
        <article class="card">
          <h3>占位项目</h3>
          <p>把这里替换成你真正的项目：一句话介绍 + 链接。</p>
        </article>
      </div>

      <footer>
        <p>© <span id="y"></span> My Blog</p>
        <div class="beian-row">
          <a class="beian-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">赣ICP备2026009462号-1</a>
          <a
            class="beian-link beian-gongan"
            href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=36010602000401"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="https://www.beian.gov.cn/img/ghs.png" width="16" height="16" alt="" />
            赣公网安备36010602000401号
          </a>
        </div>
      </footer>
    </div>

    <div class="fab-stack">
      <button type="button" class="fab" id="toTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
      <button type="button" class="fab" id="themeToggle" aria-label="切换日间/夜间主题">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M21 14.5A7.5 7.5 0 0 1 9.5 6c0-1.05.21-2.05.59-2.96A7.5 7.5 0 1 0 21 13.91c-.29.09-.59.13-.9.13-.2 0-.39-.02-.59-.04z"
          />
        </svg>
      </button>
    </div>

    <script>
      (function () {
        document.getElementById("y").textContent = new Date().getFullYear();

        const KEY = "blog-ui-theme";
        const root = document.documentElement;

        function iconMoon() {
          return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.5A7.5 7.5 0 0 1 9.5 6c0-1.05.21-2.05.59-2.96A7.5 7.5 0 1 0 21 13.91c-.29.09-.59.13-.9.13-.2 0-.39-.02-.59-.04z"/></svg>';
        }
        function iconSun() {
          return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.8 1.42-1.42zm10.48 0l1.79-1.79 1.41 1.41-1.79 1.8-1.41-1.42zM12 4V1h-2v3h2zm0 19v-3h-2v3h2zm8-9h3v-2h-3v2zM1 12h3v-2H1v2zm14.24 7.16l1.79 1.79 1.41-1.41-1.79-1.8-1.41 1.42zM6.76 19.16l-1.8 1.79-1.41-1.41 1.79-1.8 1.42 1.42zM12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg>';
        }

        function applyTheme(t) {
          root.dataset.theme = t;
          localStorage.setItem(KEY, t);
          var btn = document.getElementById("themeToggle");
          if (!btn) return;
          btn.innerHTML = t === "night" ? iconSun() : iconMoon();
          btn.setAttribute("aria-label", t === "night" ? "切换到日间模式" : "切换到夜间模式");
        }

        var saved = localStorage.getItem(KEY);
        applyTheme(saved === "day" || saved === "night" ? saved : "day");

        document.getElementById("themeToggle").addEventListener("click", function () {
          applyTheme(root.dataset.theme === "night" ? "day" : "night");
        });

        document.getElementById("toTop").addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        function setMusicOpen(open) {
          document.body.classList.toggle("music-open", open);
          var t = document.getElementById("musicToggle");
          if (t) t.setAttribute("aria-expanded", open ? "true" : "false");
          var ov = document.getElementById("musicOverlay");
          if (ov) ov.setAttribute("aria-hidden", open ? "false" : "true");
        }

        var mt = document.getElementById("musicToggle");
        var mc = document.getElementById("musicClose");
        var mo = document.getElementById("musicOverlay");

        if (mt) {
          mt.addEventListener("click", function () {
            setMusicOpen(!document.body.classList.contains("music-open"));
          });
        }
        if (mc) mc.addEventListener("click", function () { setMusicOpen(false); });
        if (mo) mo.addEventListener("click", function () { setMusicOpen(false); });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setMusicOpen(false);
        });
      })();
    </script>
  </body>
</html>
